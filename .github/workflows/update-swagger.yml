name: Update Swagger UI
on:
  schedule: # run at 00:10 weekly on sunday
    - cron:  '0 10 * * 0'
  workflow_dispatch:

jobs:
  updateSwagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get Latest Swagger UI Release
        id: swagger-ui
        run: |
          release_tag=$(curl -sL https://api.github.com/repos/swagger-api/swagger-ui/releases/latest | jq -r ".tag_name")
          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT
          # lire dans le fichier swagger-ui.version pour obtenir la version actuelle
          current_tag=$(<swagger-ui.version)
          echo "current_tag=$current_tag" >> $GITHUB_OUTPUT
      - name: Update Swagger UI
        if: steps.swagger-ui.outputs.current_tag != steps.swagger-ui.outputs.release_tag
        env:
          RELEASE_TAG: ${{ steps.swagger-ui.outputs.release_tag }}
          SWAGGER_YAML: "swagger.yaml"
        run: |
          # Delete the dist directory and index.html
          rm -fr dist index.html
          # Download the release
          curl -sL -o $RELEASE_TAG https://api.github.com/repos/swagger-api/swagger-ui/tarball/$RELEASE_TAG
          # Extract the dist directory
          tar -xzf $RELEASE_TAG --strip-components=1 $(tar -tzf $RELEASE_TAG | head -1 | cut -f1 -d"/")/dist
          rm $RELEASE_TAG
          # Move index.html to the root
          mv dist/index.html .
          # Fix references in dist/swagger-initializer and index.html
          sed -i "s|https://petstore.swagger.io/v2/swagger.json|$SWAGGER_YAML|g" dist/swagger-initializer.js
          sed -i "s|href=\"./|href=\"dist/|g" index.html
          sed -i "s|src=\"./|src=\"dist/|g" index.html
          sed -i "s|href=\"index|href=\"dist/index|g" index.html
          # Update current release
          echo ${{ steps.swagger-ui.outputs.release_tag }} > swagger-ui.version
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update swagger-ui to ${{ steps.swagger-ui.outputs.release_tag }}
          title: Update SwaggerUI to ${{ steps.swagger-ui.outputs.release_tag }}
          body: |
            Updates [swagger-ui][1] to ${{ steps.swagger-ui.outputs.release_tag }}

            Auto-generated by [create-pull-request][2]

            [1]: https://github.com/swagger-api/swagger-ui
            [2]: https://github.com/peter-evans/create-pull-request
          labels: dependencies, automated pr
          branch: swagger-ui-updates

      - name: Get Latest OpenAI OpenAPI Version
        id: openai-openapi
        run: |
          yq --version >/dev/null 2>&1 || (echo "yq is not installed. Please install yq to run this workflow." && exit 1)
          # Extract version from info.version
          api_version=$(curl -sL https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml | yq -r '.info.version')
          echo "api_version=$api_version" >> $GITHUB_OUTPUT
          
          # Get current version from swagger.yaml
          if [ -f swagger.yaml ]; then
            current_version=$(yq -r '.info.version' swagger.yaml)
            echo "current_version=$current_version" >> $GITHUB_OUTPUT
          else
            echo "current_version=" >> $GITHUB_OUTPUT
          fi

      - name: Update OpenAPI Spec
        if: steps.openai-openapi.outputs.current_version != steps.openai-openapi.outputs.api_version
        run: |
          # Download the latest openapi.yaml from openai/openai-openapi repository
          curl -sL -o swagger.yaml https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml

      - name: Create OpenAI OpenAPI Update Pull Request
        if: steps.openai-openapi.outputs.current_version != steps.openai-openapi.outputs.api_version
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update OpenAPI spec to ${{ steps.openai-openapi.outputs.api_version }}
          title: Update OpenAPI spec to ${{ steps.openai-openapi.outputs.api_version }}
          body: |
            Updates OpenAI OpenAPI specification to ${{ steps.openai-openapi.outputs.api_version }}

            This PR updates the OpenAPI specification based on the latest version from [openai/openai-openapi][1]

            Auto-generated by [create-pull-request][2]

            [1]: https://github.com/openai/openai-openapi
            [2]: https://github.com/peter-evans/create-pull-request
          labels: dependencies, automated pr
          branch: openai-openapi-updates