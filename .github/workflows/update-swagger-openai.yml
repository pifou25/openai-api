name: Update Swagger UI
on:
  schedule: # run at 00:10 weekly on sunday
    - cron:  '0 10 * * 0'
  workflow_dispatch:

jobs:
  updateSwagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get Latest OpenAI OpenAPI Version
        id: openai-openapi
        run: |
          yq --version >/dev/null 2>&1 || (echo "yq is not installed. Please install yq to run this workflow." && exit 1)
          # Extract version from info.version
          api_version=$(curl -sL https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml | yq -r '.info.version')
          echo "api_version=$api_version" >> $GITHUB_OUTPUT
          
          # Get current version from swagger.yaml
          if [ -f swagger.yaml ]; then
            current_version=$(yq -r '.info.version' swagger.yaml)
            echo "current_version=$current_version" >> $GITHUB_OUTPUT
          else
            echo "current_version=" >> $GITHUB_OUTPUT
          fi

      - name: Update OpenAPI Spec
        if: steps.openai-openapi.outputs.current_version != steps.openai-openapi.outputs.api_version
        run: |
          # Download the latest openapi.yaml from openai/openai-openapi repository
          curl -sL -o swagger.yaml https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml

      - name: Create OpenAI OpenAPI Update Pull Request
        if: steps.openai-openapi.outputs.current_version != steps.openai-openapi.outputs.api_version
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update OpenAPI spec to ${{ steps.openai-openapi.outputs.api_version }}
          title: Update OpenAPI spec to ${{ steps.openai-openapi.outputs.api_version }}
          body: |
            Updates OpenAI OpenAPI specification to ${{ steps.openai-openapi.outputs.api_version }}

            This PR updates the OpenAPI specification based on the latest version from [openai/openai-openapi][1]

            Auto-generated by [create-pull-request][2]

            [1]: https://github.com/openai/openai-openapi
            [2]: https://github.com/peter-evans/create-pull-request
          labels: dependencies, automated pr
          branch: openai-openapi-updates